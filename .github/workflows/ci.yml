name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit + integration tests against in-memory H2 (MySQL mode); no services needed.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  e2e:
    name: End-to-end (Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Generate throwaway secrets
        run: |
          rand() { openssl rand -hex "$1"; }
          ADMIN_PASSWORD="$(rand 16)"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "DB_NAME=securedocs"
            echo "DB_USERNAME=securedocs"
            echo "DB_PASSWORD=$(rand 16)"
            echo "DB_ROOT_PASSWORD=$(rand 16)"
            echo "SIGNING_SECRET=$(rand 32)"
            echo "BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } > .env
      - name: Build and start the full stack
        run: docker compose --profile full up -d --build
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/actuator/health && exit 0
            sleep 5
          done
          docker compose --profile full logs app
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_ADMIN_USER: admin
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile full logs --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
