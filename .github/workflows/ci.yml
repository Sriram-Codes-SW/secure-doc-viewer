name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unit + integration tests against in-memory H2 (MySQL mode); no services needed.
      - run: ./mvnw -B verify

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx ng test --watch=false
      - run: npx ng build --configuration production

  dependency-scan:
    name: Known-vulnerability scan (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Fails the build if any Maven or npm dependency (including transitive
      # ones) has a published vulnerability.
      - run: >
          docker run --rm -v "$PWD:/src:ro" ghcr.io/google/osv-scanner:v2@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
          scan source --lockfile=/src/pom.xml --lockfile=/src/frontend/package-lock.json

  e2e:
    name: End-to-end (Docker stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Generate throwaway secrets
        run: |
          rand() { openssl rand -hex "$1"; }
          ADMIN_PASSWORD="$(rand 16)"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "DB_NAME=securedocs"
            echo "DB_USERNAME=securedocs"
            echo "DB_PASSWORD=$(rand 16)"
            echo "DB_ROOT_PASSWORD=$(rand 16)"
            echo "SIGNING_SECRET=$(rand 32)"
            echo "BOOTSTRAP_ADMIN_USERNAME=admin"
            echo "BOOTSTRAP_ADMIN_PASSWORD=$ADMIN_PASSWORD"
          } > .env
      - name: Build and start the full stack
        run: docker compose --profile full up -d --build
      - name: Scan the built images for OS and library vulnerabilities
        # Fails on any HIGH/CRITICAL vulnerability that has a fix available.
        run: |
          for image in secure-doc-viewer-app secure-doc-viewer-web; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock               aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969               image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$image"
          done
      - name: Wait for the API to be healthy
        run: |
          for i in $(seq 1 60); do
            curl -fs http://localhost:8081/actuator/health && exit 0
            sleep 5
          done
          docker compose --profile full logs app
          exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run Playwright
        working-directory: frontend
        env:
          E2E_ADMIN_USER: admin
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Service logs on failure
        if: failure()
        run: docker compose --profile full logs --tail 200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
