<div class="upload-card">
  <h1>Upload a PDF</h1>
  <p class="muted">The backend rasterizes every page and slices it into tiles &mdash; nothing about the original PDF file is kept servable afterward.</p>

  <form (ngSubmit)="submit()">
    <label for="file">PDF file</label>
    <input id="file" name="file" type="file" accept="application/pdf" (change)="onFileSelected($event)" required />

    <label for="title">Title</label>
    <input id="title" name="title" type="text" [(ngModel)]="title" (input)="onTitleInput()" maxlength="200" required />

    <fieldset>
      <legend>Who can view it</legend>
      <label class="choice">
        <input type="radio" name="visibility" value="PRIVATE" [(ngModel)]="visibility" />
        Only me and people I share it with
      </label>
      <label class="choice">
        <input type="radio" name="visibility" value="EVERYONE" [(ngModel)]="visibility" />
        Everyone who can sign in
      </label>
    </fieldset>

    @if (errorMessage()) {
      <p class="error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="uploading() || !title.trim() || !file">
      {{ uploading() ? 'Uploading & tiling…' : 'Upload' }}
    </button>
    @if (uploading()) {
      <p class="muted" role="status">Rendering every page can take a little while for long documents.</p>
    }
  </form>
</div>
