# Serves the Angular app and proxies the API, so browser, session cookie and
# CSRF cookie all share one origin.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Keep in step with spring.servlet.multipart.max-file-size (50 MB) plus form overhead.
    client_max_body_size 51m;

    # The app's own pages: scripts/styles from this origin only; tiles arrive as
    # blob: URLs; nothing may frame the viewer.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # The backend trusts these (server.forward-headers-strategy) so login
        # throttling and the audit log see the real client IP, not nginx's.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # rendering a long PDF can take a while
        proxy_request_buffering off;
        # The backend sets its own security headers on API responses.
        proxy_hide_header X-Powered-By;
    }

    location = /actuator/health {
        proxy_pass http://app:8080;
    }

    # Hashed bundles never change; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /index.html;
    }
}
