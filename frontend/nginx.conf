# Serves the Angular app and proxies the API, so browser, session cookie and
# CSRF cookie all share one origin.
#
# Security headers are set per location rather than at server level: nginx
# add_header does not merge across levels, and API responses already carry the
# backend's own (stricter) headers, which must not be duplicated.

# When the optional HTTPS front end (Caddy, fixed at 172.28.0.11) is in use, take
# the client address and scheme it reports. From anyone else these headers are
# ignored, so a client talking to nginx directly still can't choose its address.
map $realip_remote_addr $forwarded_proto {
    172.28.0.11 $http_x_forwarded_proto;
    default     $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    set_real_ip_from 172.28.0.11;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    # Keep in step with spring.servlet.multipart.max-file-size (50 MB) plus form overhead.
    client_max_body_size 51m;

    # ^~ so no regex location (e.g. the static-asset rule below) can capture an API path.
    location ^~ /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        # OVERWRITE (never append to) X-Forwarded-For with the address of the TCP
        # peer. The backend trusts this header (server.forward-headers-strategy),
        # so passing through a client-supplied value would let anyone choose the
        # IP that login throttling and the audit log see.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;   # rendering a long PDF can take a while
        proxy_request_buffering off;
    }

    location = /actuator/health {
        proxy_pass http://app:8080;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Hashed bundles never change; index.html must always be revalidated.
    location ~* \.(?:js|css|woff2?|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The app's own pages: scripts/styles from this origin only; tiles arrive as
    # blob: URLs; nothing may frame the viewer.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri $uri/ /index.html;
    }
}
