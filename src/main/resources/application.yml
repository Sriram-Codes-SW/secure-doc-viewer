server:
  port: 8080
  # Set to "native" only when running behind a trusted reverse proxy (the
  # docker-compose "full" profile does); otherwise X-Forwarded-For is ignored,
  # so clients can't spoof their IP to dodge login throttling.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      # Idle timeout: each request extends it, so an active reader is never
      # cut off mid-document, while an abandoned session still dies.
      timeout: 30m
      cookie:
        name: SDV_SESSION
        http-only: true
        same-site: strict
        # Must be true anywhere the app is served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}

secure-doc-viewer:
  # Root directory where uploaded PDFs are rasterized into per-tile PNGs.
  # Mirrors an object-storage "bucket" layout: {storage-root}/{docId}/page-{n}/tile-{row}_{col}.png
  # Keep it out of synced folders (OneDrive, Dropbox): rendered pages would be
  # uploaded to the sync provider, and sync locks break tile moves/deletes.
  storage-root: ${STORAGE_ROOT:./storage}

  # Pixel size of each square tile. Smaller tiles = more requests but each one
  # is useless in isolation, which is the point.
  # 512 px tiles: a 150-DPI letter page is ~12 tiles instead of ~35, so normal
  # skimming stays well inside the rate limit below.
  tile-size: 512

  # DPI used when rasterizing PDF pages to images before tiling.
  render-dpi: 150

  # HMAC key for tile tokens. Never committed: set SIGNING_SECRET in the
  # environment or in the git-ignored .env file (see .env.example).
  # Startup fails if it is missing or shorter than 32 characters.
  signing-secret: ${SIGNING_SECRET:}

  # How long a signed tile URL remains valid after being issued.
  url-ttl-seconds: 120

  # Upload limits, checked before anything is rendered. Pixel limit is per
  # page at render-dpi: 40M px is roughly A1 at 150 DPI.
  max-pages: 500
  max-page-pixels: 40000000

  # At most this many PDFs render at once (rendering is CPU- and memory-heavy);
  # further uploads wait up to render-queue-timeout-seconds, then get 503.
  max-concurrent-renders: 2
  render-queue-timeout-seconds: 30

  # Watermark look: ink opacity (0.05-0.6) and gap between copies as a multiple
  # of the text height. Each mark shows the viewer, a UTC timestamp and a short
  # trace code matching the session column of the audit log.
  watermark-opacity: 0.2
  watermark-spacing: 1.5

  # Max tiles a single user may redeem within the rolling window below.
  # This is what stands between "read the pages you're viewing" and
  # "script every tile of every page in one burst" — a valid signature,
  # unexpired token, and live session still only get throttled access.
  # With 512 px tiles a 150-DPI letter page is ~12 tiles, so 180 lets a reader
  # skim ~15 pages a minute without waiting while still bounding a scrape.
  tile-rate-limit-per-window: 180

  # Width of the rolling window the limit above applies to.
  tile-rate-limit-window-seconds: 60

  # How long audit events are kept before the nightly purge deletes them.
  audit-retention-days: 180

  # First admin, created only when the database has no accounts at all.
  # If no password is given, a random one is generated and logged once.
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # Only the health check; nothing else from Actuator is reachable over HTTP.
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

spring:
  config:
    # Local development: secrets live in a git-ignored .env next to pom.xml
    # (the same file docker compose reads). Real environment variables win.
    import: optional:file:.env[.properties]

  datasource:
    # connectionTimeZone=UTC: DATETIME columns hold UTC regardless of the JVM's
    # time zone, so a backend in UTC (Docker) and one in local time (a dev
    # machine) read the same instant back.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:securedocs}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USERNAME:securedocs}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    # Flyway owns the schema; Hibernate never alters it.
    hibernate:
      ddl-auto: none

  servlet:
    multipart:
      # Keep in step with GlobalExceptionHandler.MAX_UPLOAD_MB and the frontend check.
      max-file-size: 50MB
      max-request-size: 51MB
